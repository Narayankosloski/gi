<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Character Creator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

<div class="logo" >
GI
</div>

<div class="menu">
<a href="#logo">TITLE</a>
<a href="#creator">CREATION</a>
<a href="#projects">WORK</a>
<a href="#contact">CONTACT</a>
</div>

</nav>

<!-- HERO -->

<header class="hero" id="logo">

<div class="video-bg">

</div>

<div class="overlay"></div>

<div class="hero-content reveal">

<h1>
GI<br>
MARIA
</h1>

<div class="line"></div>

<p>
ARTESANATO E PERSONALIZAÇÃO 
</p>

</div>

</header>
<section class="creator" >

<div class="container" id="creator">


    <h1>Character Creator</h1>

    <div class="editor">

        <!-- PERSONAGEM -->
        <div class="personagem">

            <img id="body" src="img/body/body1.png">

            <img id="pants" src="img/pants/pants1.png">

            <img id="shoes" src="img/shoes/shoes1.png">

            <img id="shirt" src="img/clothes/shirt1.png">

            <img id="eyes" src="img/eyes/eyes1.png">

            <img id="hair" src="img/hair/hair1.png">

        </div>

        <!-- MENU -->
        <div class="menus">

            <!-- Categorias -->
            <div class="categorias">

                <button onclick="openCategory('hair')">
    <img src="img/hair/hair1.png" alt="Cabelo">
</button>

                <button onclick="openCategory('eyes')">👁</button>

                <button onclick="openCategory('shirt')">👕</button>

                <button onclick="openCategory('pants')">👖</button>

                <button onclick="openCategory('shoes')">👟</button>

            </div>

            <!-- Opções geradas pelo JavaScript -->
            <div id="options" class="options"></div>

        </div>

    </div>

</div>
<div class="request-box">

    <h3>Deseja algum detalhe especial?</h3>

    <textarea
        id="request"
        placeholder="Ex: cabelo mais cacheado, olhos verdes, colocar um laço vermelho, mudar a cor do vestido..."
    ></textarea>

</div>  

<div class="actions">

    <button id="download">
        Baixar Personagem
    </button>

    <button id="reset">
        Reiniciar
    </button>

</div>
</section>
<!-- CONTACT -->

<section class="contact" id="contact">

<h2 class="reveal">
LET'S<br>
CREATE<br>
SOMETHING
</h2>

<div class="contact-links reveal">

</div>

</section>
